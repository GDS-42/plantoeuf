<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plantoeuf</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 70rem; margin: 1rem auto; padding: 0 1rem; color: #1f2a1f; background: #fbfcf8; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.15rem; border-bottom: 1px solid #c9d3c0; padding-bottom: 0.25rem; margin-top: 2rem; }
  nav a { margin-right: 1rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin-bottom: 1rem; padding: 0.75rem; background: #eef2e8; border-radius: 0.4rem; }
  label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; }
  input, select, button { font: inherit; padding: 0.3rem 0.5rem; }
  input[type="number"] { width: 7rem; }
  .aide { flex-basis: 100%; margin: 0; font-size: 0.85rem; color: #4d5a46; }
  .erreur { flex-basis: 100%; margin: 0; color: #a12a1a; font-weight: 600; }
  ul.liste { list-style: none; padding: 0; }
  ul.liste li { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; padding: 0.35rem 0; border-bottom: 1px solid #e1e6da; }
  ul.liste li span.resume { flex: 1 1 20rem; }
  .defilement { overflow-x: auto; }
  table#tableau { border-collapse: collapse; font-size: 0.85rem; }
  #tableau caption { caption-side: top; text-align: left; padding: 0.4rem 0; color: #4d5a46; }
  #tableau th, #tableau td { border: 1px solid #d5dccd; padding: 0.3rem 0.5rem; vertical-align: top; }
  #tableau thead th { background: #eef2e8; white-space: nowrap; }
  #tableau tbody th, #tableau tfoot th { text-align: left; font-weight: normal; }
  #tableau th[rowspan] { font-weight: 600; }
  #tableau td { text-align: right; white-space: nowrap; }
  #tableau td .mediane { display: block; font-weight: 600; }
  #tableau td .bornes { display: block; font-size: 0.75rem; color: #5a6652; }
  #tableau td.nul { color: #a3ad9b; }
  .bandeau.exemple { background: #e3eefa; color: #1d3a5c; }
  .bandeau { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 1rem 0; padding: 0.6rem 0.9rem; border-radius: 0.4rem; background: #fff0d4; color: #5c3300; }
  #import-message { font-weight: 600; color: #2f5a1c; }
  #import-message.erreur { color: #a12a1a; }
  .sur-occupation { margin-left: 0.5rem; padding: 0.1rem 0.4rem; border-radius: 0.3rem; color: #7a3f00; background: #fff0d4; }
  #tableau tfoot { border-top: 2px solid #8a9a7e; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 data-texte="titre"></h1>
  <nav>
    <a href="#section-tableau" data-texte="tableau.titre"></a>
    <a href="#section-espaces" data-texte="espaces.titre"></a>
    <a href="#section-cultures" data-texte="cultures.titre"></a>
    <a href="#section-varietes" data-texte="varietes.titre"></a>
    <a href="#section-plantations" data-texte="plantations.titre"></a>
    <a href="#section-sauvegarde" data-texte="sauvegarde.titre"></a>
  </nav>
</header>

<div id="proposition-exemple" class="bandeau exemple" hidden>
  <span id="proposition-texte"></span>
  <button id="charger-exemple" type="button" data-texte="exemple.charger"></button>
</div>

<div id="bandeau-exemple" class="bandeau exemple" hidden>
  <span data-texte="exemple.chargee"></span>
  <button id="effacer-exemple" type="button" data-texte="exemple.effacer"></button>
</div>

<div id="rappel-export" class="bandeau" role="alert" hidden>
  <span id="rappel-texte"></span>
  <button id="rappel-exporter" type="button" data-texte="sauvegarde.rappelExporter"></button>
</div>

<section id="section-tableau">
  <h2 data-texte="tableau.titre"></h2>
  <p id="tableau-vide" data-texte="tableau.aucun"></p>
  <div class="defilement">
    <table id="tableau">
      <caption data-texte="tableau.legende"></caption>
      <thead></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>
  </div>
</section>

<section id="section-espaces">
  <h2 data-texte="espaces.titre"></h2>
  <form id="form-espace" data-objet="espaces">
    <label><span data-texte="espaces.nom"></span>
      <input id="espace-nom" data-champ="nom" required>
    </label>
    <label><span data-texte="espaces.surface"></span>
      <input id="espace-surface" data-champ="surface" data-format="nombre" type="number" min="0" step="any" required>
    </label>
    <label><span data-texte="espaces.type"></span>
      <select id="espace-type" data-champ="type" data-options="typesEspace"></select>
    </label>
    <button id="espace-ajouter" type="submit" data-texte="espaces.ajouter"></button>
    <button id="espace-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
    <p id="espace-erreur" class="erreur" role="alert" hidden></p>
  </form>
  <p id="espaces-vide" data-texte="espaces.aucun"></p>
  <ul id="liste-espaces" class="liste"></ul>
</section>

<section id="section-cultures">
  <h2 data-texte="cultures.titre"></h2>
  <form id="form-culture" data-objet="cultures">
    <label><span data-texte="cultures.nom"></span>
      <input id="culture-nom" data-champ="nom" required>
    </label>
    <label><span data-texte="cultures.famille"></span>
      <input id="culture-famille" data-champ="famille">
    </label>
    <label><span data-texte="cultures.unite"></span>
      <select id="culture-unite" data-champ="unite" data-options="unitesVente"></select>
    </label>
    <label><span data-texte="cultures.rendement"></span>
      <input id="culture-rendement" data-champ="rendement" data-format="fourchette" required>
    </label>
    <label><span data-texte="cultures.prix"></span>
      <input id="culture-prix" data-champ="prix" data-format="fourchette" required>
    </label>
    <label><span data-texte="cultures.joursAvantRecolte"></span>
      <input id="culture-joursAvantRecolte" data-champ="joursAvantRecolte" data-format="nombre" type="number" min="0" step="1" required>
    </label>
    <label><span data-texte="cultures.semainesRecolte"></span>
      <input id="culture-semainesRecolte" data-champ="semainesRecolte" data-format="nombre" type="number" min="1" step="1" required>
    </label>
    <label><span data-texte="cultures.pertes"></span>
      <input id="culture-pertes" data-champ="pertes" data-format="nombre" type="number" min="0" max="100" step="any" required>
    </label>
    <p class="aide" data-texte="cultures.aideFourchette"></p>
    <button id="culture-ajouter" type="submit" data-texte="cultures.ajouter"></button>
    <button id="culture-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
    <p id="culture-erreur" class="erreur" role="alert" hidden></p>
  </form>
  <p id="cultures-vide" data-texte="cultures.aucun"></p>
  <ul id="liste-cultures" class="liste"></ul>
</section>

<section id="section-varietes">
  <h2 data-texte="varietes.titre"></h2>
  <form id="form-variete" data-objet="varietes">
    <label><span data-texte="varietes.nom"></span>
      <input id="variete-nom" data-champ="nom" required>
    </label>
    <label><span data-texte="varietes.culture"></span>
      <select id="variete-cultureId" data-champ="cultureId" required></select>
    </label>
    <label><span data-texte="cultures.rendement"></span>
      <input id="variete-rendement" data-champ="rendement" data-format="fourchette">
    </label>
    <label><span data-texte="cultures.prix"></span>
      <input id="variete-prix" data-champ="prix" data-format="fourchette">
    </label>
    <label><span data-texte="cultures.joursAvantRecolte"></span>
      <input id="variete-joursAvantRecolte" data-champ="joursAvantRecolte" data-format="nombre" type="number" min="0" step="1">
    </label>
    <label><span data-texte="cultures.semainesRecolte"></span>
      <input id="variete-semainesRecolte" data-champ="semainesRecolte" data-format="nombre" type="number" min="1" step="1">
    </label>
    <label><span data-texte="cultures.pertes"></span>
      <input id="variete-pertes" data-champ="pertes" data-format="nombre" type="number" min="0" max="100" step="any">
    </label>
    <p class="aide"><span data-texte="varietes.aide"></span> <span data-texte="cultures.aideFourchette"></span></p>
    <button id="variete-ajouter" type="submit" data-texte="varietes.ajouter"></button>
    <button id="variete-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
    <p id="variete-erreur" class="erreur" role="alert" hidden></p>
  </form>
  <p id="varietes-vide" data-texte="varietes.aucun"></p>
  <ul id="liste-varietes" class="liste"></ul>
</section>

<section id="section-plantations">
  <h2 data-texte="plantations.titre"></h2>
  <form id="form-plantation" data-objet="plantations">
    <label><span data-texte="plantations.variete"></span>
      <select id="plantation-varieteId" data-champ="varieteId" required></select>
    </label>
    <label><span data-texte="plantations.espace"></span>
      <select id="plantation-espaceId" data-champ="espaceId" required></select>
    </label>
    <label><span data-texte="plantations.surface"></span>
      <input id="plantation-surface" data-champ="surface" data-format="nombre" type="number" min="0" step="any" required>
    </label>
    <label><span data-texte="plantations.date"></span>
      <input id="plantation-date" data-champ="date" type="date" required>
    </label>
    <button id="plantation-ajouter" type="submit" data-texte="plantations.ajouter"></button>
    <button id="plantation-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
    <p id="plantation-erreur" class="erreur" role="alert" hidden></p>
  </form>
  <p id="plantations-vide" data-texte="plantations.aucun"></p>
  <ul id="liste-plantations" class="liste"></ul>
</section>

<section id="section-sauvegarde">
  <h2 data-texte="sauvegarde.titre"></h2>
  <p data-texte="sauvegarde.explication"></p>
  <p>
    <button id="exporter" type="button" data-texte="sauvegarde.exporter"></button>
  </p>
  <p>
    <label><span data-texte="sauvegarde.importer"></span>
      <input id="importer" type="file" accept=".json,application/json">
    </label>
  </p>
  <p id="import-message" role="status" hidden></p>
</section>

<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="calc.js"></script>
<script src="exemple.js"></script>
<script src="ui-commun.js"></script>
<script src="ui-saisie.js"></script>
<script src="ui-tableau.js"></script>
<script src="ui-sauvegarde.js"></script>
<script>
(function () {
  "use strict";

  const T = UiCommun.T;
  let ferme = Store.ouvrir(window.localStorage);
  const fermeOuverte = () => ferme;
  const saisie = UiSaisie.creer({ ferme: fermeOuverte, rafraichir });
  const sauvegarde = UiSauvegarde.creer({
    ferme: fermeOuverte,
    apresImport: () => {
      saisie.quitterToutes();
      rafraichir();
    },
  });

  function donneesActives() {
    const donnees = {};
    for (const objet of Store.OBJETS) donnees[objet] = ferme.lister(objet);
    return donnees;
  }

  // Tout l'affichage se recalcule depuis les données enregistrées (EX-05).
  function rafraichir() {
    const donnees = donneesActives();
    saisie.afficher(donnees);
    UiTableau.afficher(Calc.tableau(donnees));

    // EX-10 : l'exemple est proposé tant que la ferme est vide, effaçable tant qu'il en reste quelque chose.
    const fermeVide = Store.OBJETS.every((objet) => donnees[objet].length === 0);
    document.getElementById("proposition-exemple").hidden = !fermeVide;
    document.getElementById("bandeau-exemple").hidden = !Exemple.estAffichee(ferme);
  }

  // ---- Démarrage

  document.title = T.titre;
  UiCommun.traduire(document);
  saisie.brancher(document);
  sauvegarde.brancher();

  document.getElementById("proposition-texte").textContent = UiCommun.remplir(T.exemple.proposition, { plantations: Exemple.NOMBRE_DE_PLANTATIONS });
  document.getElementById("charger-exemple").addEventListener("click", () => {
    Exemple.charger(ferme, new Date().getFullYear());
    rafraichir();
  });
  document.getElementById("effacer-exemple").addEventListener("click", () => {
    Exemple.effacer(ferme);
    saisie.quitterToutes();
    rafraichir();
  });

  // EX-05 : une modification faite dans un autre onglet recalcule aussi cette page. Relire la ferme
  // évite en plus qu'une saisie ici n'écrase ce qui a été enregistré là-bas.
  window.addEventListener("storage", (evenement) => {
    if (evenement.key !== null && evenement.key !== Store.CLE) return;
    ferme = Store.ouvrir(window.localStorage);
    rafraichir();
  });

  rafraichir();
})();
</script>
</body>
</html>
