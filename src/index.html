<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plantoeuf</title>
<style>
  :root {
    --fond: #f3f5f1;
    --surface: #ffffff;
    --surface-douce: #f8faf7;
    --encre: #1b2620;
    --encre-douce: #4a564e;
    --trait: #dce2da;
    --trait-fort: #b3beb5;
    --accent: #2e6a3e;
    --accent-fonce: #1f4d2b;
    --accent-doux: #e6f0e7;
    --barre: #1e3a2a;
    --barre-douce: #d3e3d6;
    --alerte-fond: #fff1d6;
    --alerte-texte: #6b3a00;
    --info-fond: #e5eef8;
    --info-texte: #1d3f6e;
    --erreur: #a12a1a;
    --entete-tableau: #eaf0e8;
    --largeur-saisie: 30rem;
  }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--fond); color: var(--encre);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  h1, h2 { margin: 0; }

  /* Barre du haut */
  .barre { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.5rem; padding: 0.6rem 1.25rem; background: var(--barre); color: #ffffff; }
  .marque { display: flex; align-items: baseline; gap: 0.6rem; }
  .marque h1 { font-size: 1.3rem; }
  .marque span { color: var(--barre-douce); font-size: 0.95rem; }
  .synthese { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; }
  .synthese-titre { color: var(--barre-douce); font-size: 0.8rem; }
  .synthese-valeur { font-variant-numeric: tabular-nums; }
  .synthese .mediane { font-size: 1.25rem; font-weight: 700; }
  .synthese-bornes { margin-left: 0.4rem; color: var(--barre-douce); font-size: 0.875rem; }
  .pour-lecteur-d-ecran { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Bandeaux d'information et d'alerte */
  .bandeau { flex: none; display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; padding: 0.5rem 1.25rem; background: var(--alerte-fond); color: var(--alerte-texte); border-bottom: 1px solid var(--trait); }
  .bandeau.exemple { background: var(--info-fond); color: var(--info-texte); }
  .bandeau > span { flex: 1 1 20rem; }

  /* Deux volets : la saisie à gauche, la projection à droite, chacun avec son défilement (EX-11) */
  .volets { flex: 1; min-height: 0; display: flex; }
  .volet-saisie { flex: none; width: var(--largeur-saisie); overflow-y: auto; border-right: 1px solid var(--trait); padding: 0 1rem 2rem; box-sizing: border-box; }
  .volet-projection { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0.9rem 1.25rem 1rem; }
  #section-tableau, #section-offre, #section-points { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .onglets { flex: none; display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.7rem; border-bottom: 1px solid var(--trait-fort); }
  .onglets button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 0.4rem 0.8rem; color: var(--encre-douce); font-weight: 600; }
  .onglets button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent-fonce); }
  .onglets button:hover { color: var(--encre); }
  .defilement { flex: 1; min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; }
  #tableau-vide { margin: 0; }

  /* Saisie : un panneau par objet (EX-12) */
  .raccourcis { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 -1rem; padding: 0.7rem 1rem; background: var(--fond); border-bottom: 1px solid var(--trait); }
  .raccourcis a { padding: 0.2rem 0.65rem; border: 1px solid var(--trait-fort); border-radius: 999px; background: var(--surface); color: var(--encre); font-size: 0.875rem; text-decoration: none; }
  .raccourcis a:hover { border-color: var(--accent); color: var(--accent-fonce); }
  .compte-raccourci { color: var(--encre-douce); }
  .panneau { margin-top: 1rem; background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; scroll-margin-top: calc(var(--hauteur-raccourcis, 3.5rem) + 0.75rem); }
  .panneau-entete { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.75rem 1rem 0.5rem; }
  .panneau-entete h2 { font-size: 1.1rem; }
  .compte { min-width: 1.6rem; padding: 0 0.45rem; border-radius: 999px; background: var(--accent-doux); color: var(--accent-fonce); font-size: 0.875rem; font-weight: 600; text-align: center; }
  .mode-modification { margin-left: auto; padding: 0.05rem 0.5rem; border-radius: 4px; background: var(--alerte-fond); color: var(--alerte-texte); font-size: 0.875rem; font-weight: 600; }
  .panneau[data-mode="modification"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .panneau form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem 0.75rem; margin: 0; padding: 0.75rem 1rem; background: var(--surface-douce); border-top: 1px solid var(--trait); border-bottom: 1px solid var(--trait); }
  .panneau form > .aide, .panneau form > .erreur, .panneau form > .boutons { grid-column: 1 / -1; }
  .boutons { display: flex; gap: 0.5rem; }
  label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.875rem; color: var(--encre); }
  input, select { font: inherit; padding: 0.35rem 0.5rem; border: 1px solid var(--trait-fort); border-radius: 6px; background: var(--surface); color: var(--encre); min-width: 0; }
  input[type="number"], input[type="date"], select { width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: 0.35rem 0.8rem; border: 1px solid var(--trait-fort); border-radius: 6px; background: var(--surface); color: var(--encre); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.principal { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
  button.principal:hover { background: var(--accent-fonce); }
  .aide { margin: 0; font-size: 0.875rem; color: var(--encre-douce); }
  .erreur { margin: 0; color: var(--erreur); font-weight: 600; }
  .vide { margin: 0; padding: 0.6rem 1rem; color: var(--encre-douce); font-size: 0.875rem; }
  ul.liste { list-style: none; padding: 0; margin: 0; }
  ul.liste li { display: flex; flex-wrap: wrap; gap: 0.4rem 0.5rem; align-items: center; padding: 0.45rem 1rem; border-bottom: 1px solid var(--trait); }
  ul.liste li:last-child { border-bottom: 0; }
  ul.liste li span.resume { flex: 1 1 14rem; }
  ul.liste li button { padding: 0.2rem 0.6rem; font-size: 0.875rem; }
  ul.liste li button[data-action="supprimer"] { color: var(--erreur); }
  ul.liste li[aria-current="true"] { background: var(--accent-doux); box-shadow: inset 4px 0 0 var(--accent); }
  .sur-occupation { margin-left: 0.5rem; padding: 0.1rem 0.4rem; border-radius: 0.3rem; color: var(--alerte-texte); background: var(--alerte-fond); }
  .explication { margin: 0; padding: 0 1rem 0.75rem; color: var(--encre-douce); font-size: 0.875rem; }
  .actions-sauvegarde { display: flex; flex-direction: column; align-items: flex-start; gap: 0.75rem; padding: 0 1rem 0.75rem; }
  #import-message { margin: 0; padding: 0 1rem 0.75rem; font-weight: 600; color: var(--accent-fonce); }
  #import-message.erreur { color: var(--erreur); }

  /* Tableau économique : mois figés en haut, culture et estimation à gauche, total à droite (EX-13) */
  .volet-projection h2 { font-size: 1.15rem; }
  .legende { margin: 0; color: var(--encre-douce); font-size: 0.875rem; }
  table.grille { --col-culture: 8.5rem; --col-mesure: 9.5rem; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  .grille th, .grille td { border-right: 1px solid var(--trait); border-bottom: 1px solid var(--trait); padding: 0.3rem 0.55rem; vertical-align: top; background: var(--surface); }
  .grille thead th { position: sticky; top: 0; z-index: 3; background: var(--entete-tableau); font-weight: 600; text-align: right; white-space: nowrap; border-bottom-color: var(--trait-fort); }
  .grille thead th:nth-child(1), .grille thead th:nth-child(2) { text-align: left; white-space: normal; z-index: 4; }
  .grille thead th:nth-child(1), .grille tbody th[rowspan], .grille tfoot th[rowspan] { position: sticky; left: 0; width: var(--col-culture); min-width: var(--col-culture); max-width: var(--col-culture); box-sizing: border-box; }
  .grille thead th:nth-child(2), .grille tbody th:not([rowspan]), .grille tfoot th:not([rowspan]) { position: sticky; left: var(--col-culture); width: var(--col-mesure); min-width: var(--col-mesure); max-width: var(--col-mesure); box-sizing: border-box; box-shadow: 1px 0 0 var(--trait-fort); }
  .grille tbody th, .grille tfoot th { z-index: 2; text-align: left; font-weight: normal; color: var(--encre); }
  .grille th[rowspan] { font-weight: 600; }
  .grille tbody tr[data-mesure="marge"] > *, .grille tfoot tr:last-child > * { border-bottom-color: var(--trait-fort); }
  .grille td { text-align: right; white-space: nowrap; min-width: 5.5rem; }
  .grille td .mediane { display: block; font-weight: 600; }
  .grille td .bornes { display: block; font-size: 0.8rem; color: var(--encre-douce); }
  .grille td.nul .mediane { color: var(--encre-douce); font-weight: 400; }
  .grille td.nul .bornes { display: none; }
  .grille tfoot th, .grille tfoot td { background: var(--surface-douce); }
  .grille tfoot tr:first-child > * { border-top: 2px solid var(--trait-fort); }
  /* La colonne Total reste au bord droit pendant que les mois défilent : le chiffre de la saison reste sous les yeux. */
  #tableau thead th:last-child, #tableau td[data-mois="total"] { position: sticky; right: 0; z-index: 2; box-shadow: -1px 0 0 var(--trait-fort); }
  #tableau thead th:last-child { z-index: 4; }

  /* Offre et demande : la case d'offre se colore selon l'écart avec la demande (EX-20) */
  .grille td.etat-depasse { background: var(--info-fond); }
  .grille td.etat-manque { background: var(--alerte-fond); }
  .grille td[data-sur="true"] { box-shadow: inset 0 0 0 2px var(--encre-douce); }
  .grille td .ecart { display: block; font-size: 0.8rem; font-weight: 600; }
  .grille td.etat-depasse .ecart { color: var(--info-texte); }
  .grille td.etat-manque .ecart { color: var(--alerte-texte); }

  /* Écran étroit : une seule colonne, la projection en premier */
  @media (max-width: 1099px) {
    body { display: block; height: auto; }
    .volets { flex-direction: column; }
    .volet-projection { order: -1; }
    .volet-saisie { width: auto; overflow: visible; border-right: 0; }
    .defilement { max-height: 70vh; }
  }

  /* Focus clavier toujours visible (EX-16) ; à l'intérieur des zones qui défilent, pour ne pas être rogné. */
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .volet-saisie:focus-visible, .defilement:focus-visible { outline-offset: -3px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="barre">
  <div class="marque">
    <h1 data-texte="marque"></h1>
    <span data-texte="sousTitre"></span>
  </div>
  <div id="synthese" class="synthese" aria-live="polite">
    <span class="synthese-titre" data-texte="synthese.titre"></span>
    <span class="synthese-valeur">
      <span class="mediane" data-valeur="0"></span>
      <span class="synthese-bornes"><span data-texte="synthese.entre"></span> <span class="basse" data-valeur="0"></span> <span data-texte="synthese.et"></span> <span class="haute" data-valeur="0"></span></span>
    </span>
  </div>
</header>

<div id="proposition-exemple" class="bandeau exemple" hidden>
  <span id="proposition-texte"></span>
  <button id="charger-exemple" type="button" data-texte="exemple.charger"></button>
</div>

<div id="bandeau-exemple" class="bandeau exemple" hidden>
  <span data-texte="exemple.chargee"></span>
  <button id="effacer-exemple" type="button" data-texte="exemple.effacer"></button>
</div>

<div id="rappel-export" class="bandeau" role="alert" hidden>
  <span id="rappel-texte"></span>
  <button id="rappel-exporter" type="button" data-texte="sauvegarde.rappelExporter"></button>
</div>

<div class="volets">
<div class="volet-saisie" id="volet-saisie">
  <nav id="raccourcis" class="raccourcis" data-texte-aria="panneaux.raccourcis">
    <a href="#section-espaces"><span data-texte="espaces.titre"></span> <span class="compte-raccourci" data-objet="espaces"></span></a>
    <a href="#section-cultures"><span data-texte="cultures.titre"></span> <span class="compte-raccourci" data-objet="cultures"></span></a>
    <a href="#section-varietes"><span data-texte="varietes.titre"></span> <span class="compte-raccourci" data-objet="varietes"></span></a>
    <a href="#section-plantations"><span data-texte="plantations.titre"></span> <span class="compte-raccourci" data-objet="plantations"></span></a>
    <a href="#section-pointsVente"><span data-texte="pointsVente.titre"></span> <span class="compte-raccourci" data-objet="pointsVente"></span></a>
    <a href="#section-seances"><span data-texte="seances.titre"></span> <span class="compte-raccourci" data-objet="seances"></span></a>
    <a href="#section-debouches"><span data-texte="debouches.titre"></span> <span class="compte-raccourci" data-objet="debouches"></span></a>
    <a href="#section-lots"><span data-texte="poules.titre"></span> <span class="compte-raccourci" data-objet="lots"></span></a>
    <a href="#section-sauvegarde"><span data-texte="sauvegarde.titre"></span></a>
  </nav>
  <section id="section-espaces" class="panneau" data-objet="espaces">
    <div class="panneau-entete">
      <h2 data-texte="espaces.titre"></h2>
      <span class="compte">0</span>
      <span class="mode-modification" data-texte="panneaux.modification" hidden></span>
    </div>
    <form id="form-espace" data-objet="espaces">
      <label><span data-texte="espaces.nom"></span>
        <input id="espace-nom" data-champ="nom" required>
      </label>
      <label><span data-texte="espaces.surface"></span>
        <input id="espace-surface" data-champ="surface" data-format="nombre" type="number" min="0" step="any" required>
      </label>
      <label><span data-texte="espaces.type"></span>
        <select id="espace-type" data-champ="type" data-options="typesEspace"></select>
      </label>
      <div class="boutons">
        <button id="espace-ajouter" type="submit" class="principal" data-texte="espaces.ajouter"></button>
        <button id="espace-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
      </div>
      <p id="espace-erreur" class="erreur" role="alert" hidden></p>
    </form>
    <p id="espaces-vide" class="vide" data-texte="espaces.aucun"></p>
    <ul id="liste-espaces" class="liste"></ul>
  </section>

  <section id="section-cultures" class="panneau" data-objet="cultures">
    <div class="panneau-entete">
      <h2 data-texte="cultures.titre"></h2>
      <span class="compte">0</span>
      <span class="mode-modification" data-texte="panneaux.modification" hidden></span>
    </div>
    <form id="form-culture" data-objet="cultures">
      <label><span data-texte="cultures.nom"></span>
        <input id="culture-nom" data-champ="nom" required>
      </label>
      <label><span data-texte="cultures.famille"></span>
        <input id="culture-famille" data-champ="famille">
      </label>
      <label><span data-texte="cultures.unite"></span>
        <select id="culture-unite" data-champ="unite" data-options="unitesVente"></select>
      </label>
      <label><span data-texte="cultures.rendement"></span>
        <input id="culture-rendement" data-champ="rendement" data-format="fourchette" required>
      </label>
      <label><span data-texte="cultures.prix"></span>
        <input id="culture-prix" data-champ="prix" data-format="fourchette" required>
      </label>
      <label><span data-texte="cultures.joursAvantRecolte"></span>
        <input id="culture-joursAvantRecolte" data-champ="joursAvantRecolte" data-format="nombre" type="number" min="0" step="1" required>
      </label>
      <label><span data-texte="cultures.semainesRecolte"></span>
        <input id="culture-semainesRecolte" data-champ="semainesRecolte" data-format="nombre" type="number" min="1" step="1" required>
      </label>
      <label><span data-texte="cultures.pertes"></span>
        <input id="culture-pertes" data-champ="pertes" data-format="nombre" type="number" min="0" max="100" step="any" required>
      </label>
      <p class="aide" data-texte="cultures.aideFourchette"></p>
      <div class="boutons">
        <button id="culture-ajouter" type="submit" class="principal" data-texte="cultures.ajouter"></button>
        <button id="culture-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
      </div>
      <p id="culture-erreur" class="erreur" role="alert" hidden></p>
    </form>
    <p id="cultures-vide" class="vide" data-texte="cultures.aucun"></p>
    <ul id="liste-cultures" class="liste"></ul>
  </section>

  <section id="section-varietes" class="panneau" data-objet="varietes">
    <div class="panneau-entete">
      <h2 data-texte="varietes.titre"></h2>
      <span class="compte">0</span>
      <span class="mode-modification" data-texte="panneaux.modification" hidden></span>
    </div>
    <form id="form-variete" data-objet="varietes">
      <label><span data-texte="varietes.nom"></span>
        <input id="variete-nom" data-champ="nom" required>
      </label>
      <label><span data-texte="varietes.culture"></span>
        <select id="variete-cultureId" data-champ="cultureId" required></select>
      </label>
      <label><span data-texte="cultures.rendement"></span>
        <input id="variete-rendement" data-champ="rendement" data-format="fourchette">
      </label>
      <label><span data-texte="cultures.prix"></span>
        <input id="variete-prix" data-champ="prix" data-format="fourchette">
      </label>
      <label><span data-texte="cultures.joursAvantRecolte"></span>
        <input id="variete-joursAvantRecolte" data-champ="joursAvantRecolte" data-format="nombre" type="number" min="0" step="1">
      </label>
      <label><span data-texte="cultures.semainesRecolte"></span>
        <input id="variete-semainesRecolte" data-champ="semainesRecolte" data-format="nombre" type="number" min="1" step="1">
      </label>
      <label><span data-texte="cultures.pertes"></span>
        <input id="variete-pertes" data-champ="pertes" data-format="nombre" type="number" min="0" max="100" step="any">
      </label>
      <p class="aide"><span data-texte="varietes.aide"></span> <span data-texte="cultures.aideFourchette"></span></p>
      <div class="boutons">
        <button id="variete-ajouter" type="submit" class="principal" data-texte="varietes.ajouter"></button>
        <button id="variete-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
      </div>
      <p id="variete-erreur" class="erreur" role="alert" hidden></p>
    </form>
    <p id="varietes-vide" class="vide" data-texte="varietes.aucun"></p>
    <ul id="liste-varietes" class="liste"></ul>
  </section>

  <section id="section-plantations" class="panneau" data-objet="plantations">
    <div class="panneau-entete">
      <h2 data-texte="plantations.titre"></h2>
      <span class="compte">0</span>
      <span class="mode-modification" data-texte="panneaux.modification" hidden></span>
    </div>
    <form id="form-plantation" data-objet="plantations">
      <label><span data-texte="plantations.variete"></span>
        <select id="plantation-varieteId" data-champ="varieteId" required></select>
      </label>
      <label><span data-texte="plantations.espace"></span>
        <select id="plantation-espaceId" data-champ="espaceId" required></select>
      </label>
      <label><span data-texte="plantations.surface"></span>
        <input id="plantation-surface" data-champ="surface" data-format="nombre" type="number" min="0" step="any" required>
      </label>
      <label><span data-texte="plantations.date"></span>
        <input id="plantation-date" data-champ="date" type="date" required>
      </label>
      <div class="boutons">
        <button id="plantation-ajouter" type="submit" class="principal" data-texte="plantations.ajouter"></button>
        <button id="plantation-annuler" type="button" class="annuler" data-texte="commun.annuler" hidden></button>
      </div>
      <p id="plantation-erreur" class="erreur" role="alert" hidden></p>
    </form>
    <p id="plantations-vide" class="vide" data-texte="plantations.aucun"></p>
    <ul id="liste-plantations" class="liste"></ul>
  </section>

  <section id="section-pointsVente" class="panneau" data-objet="pointsVente">
    <div class="panneau-entete">
      <h2 data-texte="pointsVente.titre"></h2>
      <span class="compte">0</span>
      <span class="mode-modification" data-texte="panneaux.modification" hidden></span>
    </div>
    <form id="form-pointVente" data-objet="pointsVente">
      <label><span data-texte="pointsVente.nom"></span>
        <input id="pointVente-nom" data-champ="nom" required>

<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="calc.js"></script>
<script src="exemple.js"></script>
<script src="ui-commun.js"></script>
<script src="ui-saisie.js"></script>
<script src="ui-tableau.js"></script>
<script src="ui-sauvegarde.js"></script>
<script src="ui-ventes.js"></script>
<script src="ui-poules.js"></script>
<script>
(function () {
  "use strict";

  const T = UiCommun.T;
  let ferme = Store.ouvrir(window.localStorage);
  const fermeOuverte = () => ferme;
  const saisie = UiSaisie.creer({ ferme: fermeOuverte, rafraichir });
  const ventes = UiVentes.creer({ ferme: fermeOuverte, saisie });
  const poules = UiPoules.creer({ saisie });
  const sauvegarde = UiSauvegarde.creer({
    ferme: fermeOuverte,
    apresImport: () => {
      saisie.quitterToutes();
      rafraichir();
    },
  });

  function donneesActives() {
    const donnees = {};
    for (const objet of Store.OBJETS) donnees[objet] = ferme.lister(objet);
    return donnees;
  }

  // Tout l'affichage se recalcule depuis les données enregistrées (EX-05).
  function rafraichir() {
    const donnees = donneesActives();
    saisie.afficher(donnees);
    ventes.afficher(donnees);
    poules.afficher(donnees);
    UiTableau.afficher(Calc.tableau(donnees));

    // EX-10 : l'exemple est proposé tant que la ferme est vide, effaçable tant qu'il en reste quelque chose.
    const fermeVide = Store.OBJETS.every((objet) => donnees[objet].length === 0);
    document.getElementById("proposition-exemple").hidden = !fermeVide;
    document.getElementById("bandeau-exemple").hidden = !Exemple.estAffichee(ferme);
  }

  // ---- Démarrage

  document.title = T.titre;
  UiCommun.traduire(document);
  UiCommun.brancherOnglets(document.querySelector("#volet-projection .onglets"));
  // La barre de raccourcis s'étale sur plusieurs lignes : un panneau atteint par un raccourci s'arrête sous elle.
  const raccourcis = document.getElementById("raccourcis");
  new ResizeObserver(() => document.documentElement.style.setProperty("--hauteur-raccourcis", `${raccourcis.offsetHeight}px`)).observe(raccourcis);
  saisie.brancher(document);
  sauvegarde.brancher();

  document.getElementById("proposition-texte").textContent = UiCommun.remplir(T.exemple.proposition, { plantations: Exemple.NOMBRE_DE_PLANTATIONS });
  document.getElementById("charger-exemple").addEventListener("click", () => {
    Exemple.charger(ferme, new Date().getFullYear());
    rafraichir();
  });
  document.getElementById("effacer-exemple").addEventListener("click", () => {
    Exemple.effacer(ferme);
    saisie.quitterToutes();
    rafraichir();
  });

  // EX-05 : une modification faite dans un autre onglet recalcule aussi cette page. Relire la ferme
  // évite en plus qu'une saisie ici n'écrase ce qui a été enregistré là-bas.
  window.addEventListener("storage", (evenement) => {
    if (evenement.key !== null && evenement.key !== Store.CLE) return;
    ferme = Store.ouvrir(window.localStorage);
    rafraichir();
  });

  rafraichir();
})();
</script>
