<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plantoeuf</title>
<style>
  /* P2 — une application à pages : barre du haut (synthèse de la saison), barre latérale de navigation,
     une page à la fois ; les formulaires s'ouvrent dans un tiroir à droite. Couleurs du maraîchage :
     vert feuille pour l'action, jaune d'œuf pour l'atelier poules, bleu et ambre pour l'offre et la demande. */
  :root {
    --fond: #f4f6f3;
    --surface: #ffffff;
    --surface-douce: #f7f9f6;
    --surface-survol: #eef3ed;
    --encre: #17211b;
    --encre-douce: #48564d;
    --encre-pale: #5b695f;
    --trait: #e1e7df;
    --trait-fort: #c6d0c7;
    --accent: #2b7a4b;
    --accent-fonce: #1f5c37;
    --accent-doux: #e2f0e6;
    --accent-texte: #1d5733;
    --sur-accent: #ffffff;
    --oeuf: #c78a12;
    --oeuf-doux: #fbf0d7;
    --oeuf-texte: #6a4600;
    --bleu: #2f62a6;
    --bleu-doux: #e4edf9;
    --bleu-texte: #1c4682;
    --ambre: #b45309;
    --ambre-doux: #fcefdf;
    --ambre-texte: #7a3500;
    --rouge: #b42318;
    --rouge-doux: #fcebe9;
    --rouge-texte: #8e1b12;
    --voile: rgb(15 23 18 / 0.38);
    --ombre: 0 1px 2px rgb(16 24 20 / 0.06), 0 1px 1px rgb(16 24 20 / 0.03);
    --ombre-haute: 0 18px 48px rgb(16 24 20 / 0.18), 0 2px 6px rgb(16 24 20 / 0.08);
    --rayon: 12px;
    --rayon-petit: 8px;
    --police: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
    --police-titre: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
    --largeur-nav: 15rem;
    --hauteur-barre: 4.25rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #0f1511; --surface: #161e19; --surface-douce: #1b241e; --surface-survol: #212c25;
      --encre: #e6ece7; --encre-douce: #b5c1b9; --encre-pale: #a0ada5; --trait: #29342d; --trait-fort: #3a473f;
      --accent: #5dbb82; --accent-fonce: #7fd0a0; --accent-doux: #1b3325; --accent-texte: #8fd8ab; --sur-accent: #07140c;
      --oeuf: #e0a83a; --oeuf-doux: #33290f; --oeuf-texte: #f1cd7c;
      --bleu: #6f9ee0; --bleu-doux: #18263b; --bleu-texte: #a9c6f0;
      --ambre: #e3934a; --ambre-doux: #352313; --ambre-texte: #f3bd86;
      --rouge: #ef7a6e; --rouge-doux: #3a1a17; --rouge-texte: #f6aaa2;
      --voile: rgb(0 0 0 / 0.55); --ombre: 0 1px 2px rgb(0 0 0 / 0.4); --ombre-haute: 0 18px 48px rgb(0 0 0 / 0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fond: #0f1511; --surface: #161e19; --surface-douce: #1b241e; --surface-survol: #212c25;
    --encre: #e6ece7; --encre-douce: #b5c1b9; --encre-pale: #a0ada5; --trait: #29342d; --trait-fort: #3a473f;
    --accent: #5dbb82; --accent-fonce: #7fd0a0; --accent-doux: #1b3325; --accent-texte: #8fd8ab; --sur-accent: #07140c;
    --oeuf: #e0a83a; --oeuf-doux: #33290f; --oeuf-texte: #f1cd7c;
    --bleu: #6f9ee0; --bleu-doux: #18263b; --bleu-texte: #a9c6f0;
    --ambre: #e3934a; --ambre-doux: #352313; --ambre-texte: #f3bd86;
    --rouge: #ef7a6e; --rouge-doux: #3a1a17; --rouge-texte: #f6aaa2;
    --voile: rgb(0 0 0 / 0.55); --ombre: 0 1px 2px rgb(0 0 0 / 0.4); --ombre-haute: 0 18px 48px rgb(0 0 0 / 0.55);
    color-scheme: dark;
  }

  /* ---- Base */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--encre);
    font: 15px/1.5 var(--police);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-family: var(--police-titre); text-wrap: balance; }
  p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .pour-lecteur-d-ecran { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .icone { width: 1.25rem; height: 1.25rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Focus clavier toujours visible (EX-16). */
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h1:focus-visible, h1:focus { outline: none; }

  /* ---- Coquille : barre du haut, navigation, contenu */
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: var(--largeur-nav) minmax(0, 1fr);
    grid-template-rows: var(--hauteur-barre) minmax(0, 1fr);
    grid-template-areas: "barre barre" "nav contenu";
  }
  .barre {
    grid-area: barre;
    display: flex; align-items: center; gap: 1.5rem;
    padding-inline: 1.25rem;
    background: var(--surface);
    border-bottom: 1px solid var(--trait);
    z-index: 5;
  }
  .marque { display: flex; align-items: center; gap: 0.6rem; color: var(--encre); text-decoration: none; }
  .marque-logo { width: 2.1rem; height: 2.1rem; flex: none; }
  .marque-nom { font: 700 1.2rem/1 var(--police-titre); letter-spacing: -0.01em; }
  .marque-sous-titre { display: block; margin-top: 0.15rem; color: var(--encre-pale); font-size: 0.8rem; line-height: 1; }

  /* Synthèse de la saison, toujours en tête (EX-14). */
  .saison { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .indicateur {
    display: grid; grid-template-columns: auto; row-gap: 0.05rem;
    padding: 0.35rem 0.85rem; border-radius: var(--rayon-petit);
    min-width: 0;
  }
  .indicateur + .indicateur { border-left: 1px solid var(--trait); border-radius: 0; }
  .indicateur-titre { color: var(--encre-pale); font-size: 0.8rem; line-height: 1.2; white-space: nowrap; }
  .indicateur-valeur { display: flex; align-items: baseline; gap: 0.5rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .indicateur-valeur .mediane { font: 700 1.25rem/1.25 var(--police-titre); letter-spacing: -0.01em; }
  .indicateur-bornes { color: var(--encre-pale); font-size: 0.8rem; }
  .indicateur.negatif .mediane { color: var(--rouge-texte); }

  .navigation {
    grid-area: nav;
    overflow-y: auto;
    padding: 1rem 0.75rem 1.5rem;
    border-right: 1px solid var(--trait);
    background: var(--fond);
  }
  .navigation ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.15rem; }
  .navigation-groupe { margin: 1.1rem 0.6rem 0.35rem; color: var(--encre-pale); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .navigation a {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.5rem 0.65rem; border-radius: var(--rayon-petit);
    color: var(--encre-douce); font-weight: 500; text-decoration: none;
  }
  .navigation a:hover { background: var(--surface-survol); color: var(--encre); }
  .navigation a[aria-current="page"] { background: var(--accent-doux); color: var(--accent-texte); font-weight: 600; }
  .compte-nav {
    margin-left: auto; min-width: 1.6rem; padding: 0 0.4rem; border-radius: 999px;
    color: var(--encre-pale); font-size: 0.8rem; text-align: center; font-variant-numeric: tabular-nums;
  }
  .navigation a[aria-current="page"] .compte-nav { color: var(--accent-texte); }
  .compte-nav:empty { display: none; }
  .pastille-alerte { margin-left: auto; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--ambre); }

  /* position: relative : les éléments placés en absolu (textes pour lecteur d'écran…) restent dans la zone qui défile. */
  .contenu { grid-area: contenu; position: relative; overflow-y: auto; scroll-padding-top: 1rem; }
  .bandeau {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem;
    margin: 1rem clamp(1rem, 3vw, 2.5rem) 0; padding: 0.75rem 1rem;
    border-radius: var(--rayon); border: 1px solid transparent;
    background: var(--ambre-doux); color: var(--ambre-texte);
  }
  .bandeau > .icone { width: 1.35rem; height: 1.35rem; }
  .bandeau > span { flex: 1 1 18rem; }
  .bandeau.exemple { background: var(--bleu-doux); color: var(--bleu-texte); }

  /* ---- Pages */
  .page { max-width: 92rem; padding: 1.75rem clamp(1rem, 3vw, 2.5rem) 3rem; display: grid; gap: 1.25rem; align-content: start; }
  .page-entete { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem 2rem; }
  .page-entete > div { flex: 1 1 28rem; min-width: 0; }
  .page-entete h1 { font-size: 1.65rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
  .page-description { margin-top: 0.35rem; max-width: 68ch; color: var(--encre-douce); }
  .page-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .colonnes { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); align-items: start; }

  /* ---- Cartes et panneaux */
  .carte { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); box-shadow: var(--ombre); min-width: 0; }
  .carte-entete { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; padding: 1rem 1.25rem; }
  .carte-entete h2 { font-size: 1.05rem; font-weight: 650; }
  .carte-entete .bouton { margin-left: auto; }
  .carte-entete + .liste, .carte-entete + .etat-vide { border-top: 1px solid var(--trait); }
  .carte-corps { padding: 0 1.25rem 1.25rem; }
  .compte {
    min-width: 1.7rem; padding: 0.05rem 0.5rem; border-radius: 999px;
    background: var(--surface-survol); color: var(--encre-douce);
    font-size: 0.8rem; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums;
  }
  .panneau[data-mode="modification"] { border-color: var(--accent); }

  /* ---- Boutons */
  .bouton {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
    min-height: 2.5rem; padding: 0.45rem 0.95rem;
    border: 1px solid var(--trait-fort); border-radius: var(--rayon-petit);
    background: var(--surface); color: var(--encre);
    font-weight: 600; line-height: 1.2; cursor: pointer; white-space: nowrap;
    transition: background-color 120ms, border-color 120ms;
  }
  .bouton:hover { background: var(--surface-survol); }
  .bouton.principal { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); }
  .bouton.principal:hover { background: var(--accent-fonce); border-color: var(--accent-fonce); }
  .bouton.discret { border-color: transparent; background: transparent; color: var(--accent-texte); }
  .bouton.discret:hover { background: var(--accent-doux); }
  .bouton .icone { width: 1.1rem; height: 1.1rem; }
  .bandeau .bouton { border-color: currentColor; background: transparent; color: inherit; }
  .bouton-icone {
    position: relative; display: inline-grid; place-items: center; width: 2.25rem; height: 2.25rem; flex: none;
    border: 1px solid transparent; border-radius: var(--rayon-petit);
    background: transparent; color: var(--encre-pale); cursor: pointer;
  }
  .bouton-icone:hover { background: var(--surface-survol); color: var(--encre); }
  .bouton-icone[data-action="supprimer"]:hover { background: var(--rouge-doux); color: var(--rouge-texte); }

  /* ---- Listes : une ligne par élément, ses actions à droite */
  ul.liste { list-style: none; margin: 0; padding: 0; }
  ul.liste li {
    display: flex; align-items: center; gap: 0.75rem 1.25rem;
    padding: 0.8rem 0.75rem 0.8rem 1.25rem;
    border-bottom: 1px solid var(--trait);
  }
  ul.liste li:last-child { border-bottom: 0; }
  ul.liste li:hover { background: var(--surface-douce); }
  ul.liste li[aria-current="true"] { background: var(--accent-doux); box-shadow: inset 3px 0 0 var(--accent); }
  .ligne-texte { flex: 1 1 auto; min-width: 0; display: grid; gap: 0.35rem; }
  .ligne-entete { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.5rem; }
  .ligne-titre { font-weight: 650; }
  .ligne-faits { display: flex; flex-wrap: wrap; gap: 0.35rem 1.75rem; margin: 0; }
  .ligne-faits > div { display: grid; gap: 0.05rem; min-width: 0; }
  .ligne-faits dt { color: var(--encre-pale); font-size: 0.8rem; }
  .ligne-faits dd { margin: 0; font-variant-numeric: tabular-nums; }

  /* Une fourchette lisible : la médiane en évidence, la basse et la haute à côté. */
  .f { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .f-mediane { font-weight: 600; }
  .f-bornes { color: var(--encre-pale); font-size: 0.85em; }
  .ligne-actions { display: flex; gap: 0.15rem; margin-left: auto; }
  .resume { overflow-wrap: anywhere; }
  .sur-occupation { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--ambre-doux); color: var(--ambre-texte); font-size: 0.85rem; font-weight: 600; }

  /* États vides : ce que la liste contiendra, et le geste suivant (EX-36). */
  .etat-vide { display: grid; justify-items: center; gap: 0.75rem; padding: 2.25rem 1.25rem; text-align: center; color: var(--encre-douce); }
  .etat-vide > .icone { width: 2.25rem; height: 2.25rem; padding: 0.55rem; box-sizing: content-box; border-radius: 50%; background: var(--accent-doux); color: var(--accent-texte); }
  .etat-vide p { max-width: 46ch; }
  .panneau:has(> .etat-vide:not([hidden])) > .carte-entete [data-ouvrir] { display: none; }

  /* ---- Puces */
  .puce { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.1rem 0.55rem; border-radius: 999px; background: var(--surface-survol); color: var(--encre-douce); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .puce.verte { background: var(--accent-doux); color: var(--accent-texte); }
  .puce.oeuf { background: var(--oeuf-doux); color: var(--oeuf-texte); }
  .puce.alerte { background: var(--ambre-doux); color: var(--ambre-texte); }

  /* ---- Tiroir : le formulaire d'ajout ou de modification (EX-31) */
  dialog.tiroir {
    margin: 0 0 0 auto; padding: 0; border: 0;
    width: min(32rem, 100vw); max-width: 100vw; height: 100%; max-height: 100%;
    background: var(--surface); color: var(--encre);
    box-shadow: var(--ombre-haute);
  }
  dialog.tiroir[open] { animation: tiroir-entree 180ms ease-out; }
  dialog.tiroir::backdrop { background: var(--voile); }
  @keyframes tiroir-entree { from { transform: translateX(2rem); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { dialog.tiroir[open] { animation: none; } }
  .tiroir form { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  .tiroir-entete { display: flex; align-items: center; gap: 0.75rem; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--trait); }
  .tiroir-entete h2 { font-size: 1.2rem; font-weight: 700; }
  .tiroir-entete .bouton-icone { margin-left: auto; }
  .tiroir-corps { overflow-y: auto; padding: 1.25rem; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-content: start; }
  .tiroir-corps > .large, .tiroir-corps > .aide, .tiroir-corps > .erreur { grid-column: 1 / -1; }
  .tiroir-pied { display: flex; justify-content: flex-end; gap: 0.6rem; padding: 1rem 1.25rem; border-top: 1px solid var(--trait); background: var(--surface-douce); }

  /* ---- Champs */
  label { display: grid; gap: 0.35rem; align-content: start; font-size: 0.9rem; font-weight: 600; color: var(--encre); }
  input, select {
    width: 100%; min-width: 0; min-height: 2.5rem; padding: 0.45rem 0.7rem;
    border: 1px solid var(--trait-fort); border-radius: var(--rayon-petit);
    background: var(--surface); color: var(--encre); font-weight: 400;
  }
  input:hover, select:hover { border-color: var(--encre-pale); }
  input[type="file"] { padding: 0.4rem; }
  .aide { color: var(--encre-douce); font-size: 0.875rem; font-weight: 400; }
  .erreur { padding: 0.6rem 0.8rem; border-radius: var(--rayon-petit); background: var(--rouge-doux); color: var(--rouge-texte); font-weight: 600; }

  /* ---- Accueil d'une ferme vide (EX-36) */
  .accueil { padding: 1.5rem; display: grid; gap: 1.25rem; }
  .accueil h2 { font-size: 1.35rem; }
  .accueil > p { color: var(--encre-douce); max-width: 70ch; }
  .etapes { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .etape { display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 0.85rem; align-content: start; padding: 1rem; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface-douce); }
  .etape-numero { grid-row: span 3; display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--surface); border: 1px solid var(--trait-fort); font-weight: 700; font-variant-numeric: tabular-nums; }
  .etape[data-fait="true"] .etape-numero { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); }
  .etape h3 { font-size: 1rem; }
  .etape p { color: var(--encre-douce); font-size: 0.9rem; }
  .etape .bouton { justify-self: start; margin-top: 0.4rem; }
  .accueil-exemple { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; padding: 1rem 1.1rem; border-radius: var(--rayon); background: var(--bleu-doux); color: var(--bleu-texte); }
  .accueil-exemple > span { flex: 1 1 22rem; }
  .accueil-exemple .bouton { border-color: currentColor; background: transparent; color: inherit; }

  /* ---- Projection : onglets et tableaux */
  .onglets { display: flex; flex-wrap: wrap; gap: 0.25rem; padding: 0.35rem; margin: 1rem 1.25rem 0; border-radius: var(--rayon-petit); background: var(--surface-survol); width: fit-content; max-width: calc(100% - 2.5rem); }
  .onglets button { border: 0; border-radius: 6px; padding: 0.45rem 0.9rem; background: transparent; color: var(--encre-douce); font-weight: 600; cursor: pointer; }
  .onglets button:hover { color: var(--encre); }
  .onglets button[aria-selected="true"] { background: var(--surface); color: var(--encre); box-shadow: var(--ombre); }
  .vue { display: grid; gap: 0.75rem; padding: 1rem 1.25rem 1.25rem; min-width: 0; }
  .vue h2 { font-size: 1.05rem; }
  .legende { color: var(--encre-douce); font-size: 0.875rem; max-width: 95ch; }
  .defilement { overflow: auto; max-height: min(70vh, 44rem); border: 1px solid var(--trait); border-radius: var(--rayon-petit); background: var(--surface); }

  table.grille { min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .grille th, .grille td { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--trait); background: var(--surface); vertical-align: top; }
  .grille thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-douce); color: var(--encre-douce); font-size: 0.8rem; font-weight: 600; text-align: right; white-space: nowrap; border-bottom-color: var(--trait-fort); }
  .grille thead th:first-child { text-align: left; left: 0; z-index: 4; }
  .grille tbody th, .grille tfoot th { position: sticky; left: 0; z-index: 2; text-align: left; font-weight: 600; }
  .grille td { text-align: right; white-space: nowrap; }
  .grille td .mediane { display: block; font-weight: 600; }
  .grille td .bornes { display: block; color: var(--encre-pale); font-size: 0.8rem; }
  .grille td.nul .mediane { color: var(--encre-pale); font-weight: 400; }
  .grille td.nul .bornes { display: none; }
  .grille tfoot th, .grille tfoot td { background: var(--surface-douce); }
  .grille tr.bandeau-atelier > th { background: var(--oeuf-doux); color: var(--oeuf-texte); font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .grille td.etat-depasse { background: var(--bleu-doux); }
  .grille td.etat-manque { background: var(--ambre-doux); }
  .grille td[data-sur="true"] { box-shadow: inset 0 0 0 2px var(--encre-pale); }
  .grille td .ecart { display: block; font-size: 0.8rem; font-weight: 600; }
  .grille td.etat-depasse .ecart { color: var(--bleu-texte); }
  .grille td.etat-manque .ecart { color: var(--ambre-texte); }

  /* ---- Synthèse : tuiles et graphique (rendus par ui-synthese.js) */
  .tuiles { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
  .graphique { padding: 0 1.25rem 1.25rem; }

  /* ==== T34 — Synthèse : chiffres clés, graphique, tableau « Par culture » ==== */
  /* ==== fin T34 ==== */

  /* ==== T35 — Ventes : offre et demande, points de vente, listes des ventes ==== */
  /* ==== fin T35 ==== */

  /* ==== T36 — Ferme : lignes des listes, calendrier de culture, poules, sauvegarde ==== */
  /* Jetons des calendriers : la croissance en teinte légère, la récolte en teinte franche ; pour les lots,
     l'avant-ponte en teinte légère et la ponte en teinte franche (jaune d'œuf). Chaque texte posé sur une
     teinte a son jeton, au contraste d'au moins 4,5:1. */
  :root {
    --cal-croissance: #d5ebdc; --cal-croissance-bord: #a3cfb1; --cal-croissance-texte: #1d5733;
    --cal-recolte: #2b7a4b; --cal-recolte-texte: #ffffff;
    --cal-arrivee: #faf0d6; --cal-arrivee-bord: #e8cf8f; --cal-arrivee-texte: #6a4600;
    --cal-ponte: #e9b949; --cal-ponte-texte: #2b1d00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cal-croissance: #21392a; --cal-croissance-bord: #3c6b4d; --cal-croissance-texte: #a6e0bc;
      --cal-recolte: #4caa72; --cal-recolte-texte: #07140c;
      --cal-arrivee: #352a10; --cal-arrivee-bord: #6b5420; --cal-arrivee-texte: #f1cd7c;
      --cal-ponte: #d9a640; --cal-ponte-texte: #1f1400;
    }
  }
  :root[data-theme="dark"] {
    --cal-croissance: #21392a; --cal-croissance-bord: #3c6b4d; --cal-croissance-texte: #a6e0bc;
    --cal-recolte: #4caa72; --cal-recolte-texte: #07140c;
    --cal-arrivee: #352a10; --cal-arrivee-bord: #6b5420; --cal-arrivee-texte: #f1cd7c;
    --cal-ponte: #d9a640; --cal-ponte-texte: #1f1400;
  }

  /* ---- Lignes des listes de la ferme : le titre à gauche, les faits alignés en colonnes d'une ligne à l'autre. */
  .liste-ferme { container: liste-ferme / inline-size; }
  .liste-ferme > li { padding-block: 0.9rem; }
  .liste-ferme .ligne-texte { grid-template-columns: minmax(0, var(--colonne-titre, 15rem)) minmax(0, 1fr); align-items: center; gap: 0.6rem 2rem; }
  .insecable { white-space: nowrap; }
  /* La tête d'une ligne : le titre seul sur sa ligne, puis ses puces et son sous-titre. */
  .liste-ferme .ligne-entete, .liste-ferme .ligne-tete { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.5rem; min-width: 0; }
  .liste-ferme .ligne-tete > .ligne-entete { display: contents; }
  .liste-ferme .ligne-titre { flex: 1 0 100%; overflow-wrap: anywhere; }
  .ligne-titre-second { font-weight: 400; color: var(--encre-douce); }
  .ligne-sous-titre { color: var(--encre-pale); font-size: 0.875rem; }
  .liste-ferme .ligne-faits { display: grid; gap: 0.5rem 1.5rem; grid-template-columns: var(--colonnes-faits, repeat(auto-fill, minmax(9rem, 1fr))); }
  .liste-ferme .ligne-faits > div { align-content: start; }
  .liste-ferme .ligne-faits dd { overflow-wrap: anywhere; }
  .liste-ferme .f { white-space: normal; }
  .liste-ferme .f-mediane, .liste-ferme .f-bornes { white-space: nowrap; }
  .ligne-note, .ligne-vide { color: var(--encre-pale); }
  .liste-ferme .ligne-texte > .sur-occupation { grid-column: 1 / -1; }
  #liste-espaces { --colonnes-faits: 6.5rem minmax(0, 1fr); }
  #liste-cultures, #liste-varietes { --colonne-titre: 14rem; --colonnes-faits: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr) 4.5rem; }
  #liste-varietes [data-fait="rendement"] { grid-column: 1; }
  #liste-varietes [data-fait="prix"] { grid-column: 2; }
  #liste-varietes [data-fait="recolte"] { grid-column: 3; }
  #liste-varietes [data-fait="pertes"] { grid-column: 4; }
  #liste-plantations { --colonnes-faits: 5rem 7rem minmax(0, 15rem) minmax(0, 1fr); }
  #liste-lots { --colonne-titre: 13rem; --colonnes-faits: minmax(0, 9.5rem) minmax(0, 1fr) minmax(10.5rem, 1.1fr) minmax(0, 1fr); }
  .puce.bleue { background: var(--bleu-doux); color: var(--bleu-texte); }
  /* La sur-occupation : une alerte qui se lit, icône et phrase, sous la ligne de l'espace. */
  .liste-ferme .sur-occupation {
    display: flex; align-items: flex-start; gap: 0.5rem; justify-self: start;
    margin: 0.15rem 0 0; padding: 0.45rem 0.75rem; border-radius: var(--rayon-petit);
    font-size: 0.875rem; line-height: 1.4;
  }
  .liste-ferme .sur-occupation .icone { width: 1.1rem; height: 1.1rem; margin-top: 0.05rem; }
  @container liste-ferme (max-width: 48rem) {
    .liste-ferme .ligne-texte { grid-template-columns: minmax(0, 1fr); }
    .liste-ferme .ligne-faits { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #liste-varietes .ligne-faits > div { grid-column: auto; }
  }
  @container liste-ferme (max-width: 30rem) {
    .liste-ferme > li { align-items: flex-start; padding-right: 0.5rem; }
    .liste-ferme .ligne-actions { flex-direction: column; }
  }

  /* ---- Calendriers : en-tête titré et légendé, une ligne par espace (ou par lot), des barres en deux teintes. */
  .cal-entete { align-items: flex-start; gap: 0.75rem 2rem; padding-bottom: 0.9rem; }
  .cal-titres { flex: 1 1 20rem; min-width: 0; }
  .cal-saison { margin-top: 0.2rem; color: var(--encre-douce); font-size: 0.875rem; }
  .cal-legende { list-style: none; margin: 0.15rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; color: var(--encre-douce); font-size: 0.8125rem; }
  .cal-legende li { display: inline-flex; align-items: center; gap: 0.45rem; white-space: nowrap; }
  .cal-pastille { flex: none; width: 1.15rem; height: 0.75rem; border-radius: 3px; }
  .cal-pastille-croissance { background: var(--cal-croissance); box-shadow: inset 0 0 0 1px var(--cal-croissance-bord); }
  .cal-pastille-recolte { background: var(--cal-recolte); }
  .cal-pastille-arrivee { background: var(--cal-arrivee); box-shadow: inset 0 0 0 1px var(--cal-arrivee-bord); }
  .cal-pastille-ponte { background: var(--cal-ponte); }
  .cal-pastille-sur-occupation { background: var(--ambre-doux); box-shadow: inset 0 -3px 0 var(--ambre); }
  .cal-pastille-aujourdhui { width: 2px; height: 1rem; border-radius: 1px; background: var(--bleu); }

  .cal-racine { padding: 0 1.25rem 1.25rem; }
  .cal-defilement { overflow-x: auto; overscroll-behavior-x: contain; border: 1px solid var(--trait); border-radius: var(--rayon-petit); }
  .cal-grille {
    --col: 9.5rem; --h: 1.6rem; --ecart: 0.375rem; --marge: 0.55rem; --largeur-mois: 4.25rem;
    position: relative; isolation: isolate;
    min-width: calc(var(--col) + var(--mois) * var(--largeur-mois));
  }
  .cal-ligne { display: grid; grid-template-columns: var(--col) minmax(0, 1fr); border-bottom: 1px solid var(--trait); }
  .cal-ligne:last-child { border-bottom: 0; }
  .cal-espace {
    position: sticky; left: 0; z-index: 3; min-width: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 0.1rem;
    padding: 0.5rem 0.75rem; background: var(--surface); border-right: 1px solid var(--trait);
  }
  .cal-espace-nom { font-size: 0.9rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .cal-espace-detail { color: var(--encre-pale); font-size: 0.8rem; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .cal-alerte { margin-top: 0.25rem; padding-inline: 0.45rem; font-size: 0.75rem; }
  .cal-alerte .icone { width: 0.85rem; height: 0.85rem; }
  .cal-piste { position: relative; z-index: 1; min-height: calc(2 * var(--marge) + var(--sous-lignes, 1) * var(--h) + (var(--sous-lignes, 1) - 1) * var(--ecart)); }
  /* L'axe des mois. */
  .cal-axe { background: var(--surface-douce); border-bottom-color: var(--trait-fort); }
  .cal-axe .cal-espace { background: var(--surface-douce); color: var(--encre-pale); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .cal-piste-mois { min-height: 2.1rem; }
  .cal-mois { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 0.55rem; color: var(--encre-douce); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  /* Quadrillage des mois et repère du jour, sous les barres. */
  .cal-quadrillage { position: absolute; z-index: 0; top: 0; bottom: 0; left: var(--col); right: 0; pointer-events: none; }
  .cal-trait { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--trait); }
  .cal-aujourdhui { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bleu); }
  .cal-aujourdhui::before { content: ""; position: absolute; top: 0.3rem; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--bleu); }
  /* La sur-occupation, sur toute la hauteur de la ligne de l'espace, aux dates du dépassement. */
  .cal-sur-occupation {
    position: absolute; top: 0; bottom: 0;
    background: color-mix(in srgb, var(--ambre) 16%, transparent);
    box-shadow: inset 0 3px 0 var(--ambre), inset 0 -3px 0 var(--ambre);
  }
  /* Une barre : un bouton, de la mise en place à la fin de la récolte, en deux périodes séparées d'un filet. */
  .cal-barre {
    position: absolute; top: calc(var(--marge) + var(--sous-ligne, 0) * (var(--h) + var(--ecart))); height: var(--h);
    display: flex; padding: 0; border: 0; border-radius: 5px; overflow: hidden;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .cal-barre:hover { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--encre-pale); }
  .cal-barre[aria-current="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .cal-segment { display: flex; align-items: center; min-width: 0; height: 100%; }
  .cal-segment:first-child:not(:only-child) { flex-grow: 0; flex-shrink: 0; margin-right: 2px; }
  .cal-segment:last-child:not(:only-child) { flex: 1 1 0; }
  .cal-segment:only-child { flex: 1 1 auto; }
  .cal-croissance { background: var(--cal-croissance); box-shadow: inset 0 0 0 1px var(--cal-croissance-bord); color: var(--cal-croissance-texte); }
  .cal-recolte { background: var(--cal-recolte); color: var(--cal-recolte-texte); }
  .cal-arrivee { background: var(--cal-arrivee); box-shadow: inset 0 0 0 1px var(--cal-arrivee-bord); color: var(--cal-arrivee-texte); }
  .cal-ponte { background: var(--cal-ponte); color: var(--cal-ponte-texte); }
  .cal-croissance:first-child, .cal-arrivee:first-child { border-radius: 5px 0 0 5px; }
  .cal-etiquette { flex: none; padding: 0 0.5rem; font-size: 0.8125rem; font-weight: 600; line-height: 1; white-space: nowrap; }
  .cal-etiquette-second { font-weight: 400; }
  .cal-etiquette.sans-second .cal-etiquette-second, .cal-etiquette.seul-second .cal-etiquette-nom { display: none; }
  /* L'infobulle d'une barre : les valeurs en avant, les libellés discrets. */
  .cal-infobulle {
    position: fixed; z-index: 30; display: grid; gap: 0.3rem;
    width: max-content; max-width: min(21rem, calc(100vw - 1rem)); padding: 0.75rem 0.9rem;
    border: 1px solid var(--trait-fort); border-radius: var(--rayon-petit);
    background: var(--surface); color: var(--encre); box-shadow: var(--ombre-haute);
    font-size: 0.875rem; pointer-events: none;
  }
  .cal-info-titre { font-size: 0.95rem; font-weight: 650; }
  .cal-info-second { font-weight: 400; color: var(--encre-douce); }
  .cal-info-sous-titre { margin-bottom: 0.2rem; color: var(--encre-pale); }
  .cal-info-ligne { display: flex; justify-content: space-between; align-items: baseline; gap: 1.25rem; }
  .cal-info-libelle { color: var(--encre-pale); white-space: nowrap; }
  .cal-info-valeur { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .cal-info-valeur .f-bornes { font-size: 0.8rem; font-weight: 400; }
  .cal-info-action { margin-top: 0.3rem; padding-top: 0.45rem; border-top: 1px solid var(--trait); color: var(--accent-texte); font-size: 0.8125rem; font-weight: 600; }
  @media (max-width: 900px) {
    .cal-racine { padding-inline: 0.75rem; }
    .cal-grille { --col: 6.5rem; --largeur-mois: 3.6rem; }
    .cal-espace { padding-inline: 0.6rem; }
  }

  /* ---- Tiroir des plantations : ce qu'il faut d'abord (EX-36). */
  .prealable { display: flex; gap: 0.75rem; padding: 0.9rem 1rem; border-radius: var(--rayon); background: var(--bleu-doux); color: var(--bleu-texte); }
  .prealable > .icone { margin-top: 0.1rem; }
  .prealable > div { display: grid; gap: 0.55rem; min-width: 0; }
  .prealable p { font-weight: 600; }
  .prealable ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.45rem; }
  .prealable li { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.2rem 0.75rem; }
  .prealable-lien { display: inline-flex; align-items: center; gap: 0.3rem; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .prealable-lien .icone { width: 1rem; height: 1rem; }

  /* ---- Tiroir des plantations : la récolte que donnera la saisie en cours. */
  .apercu { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.8rem 1rem; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--accent-doux); color: var(--accent-texte); }
  .apercu > .icone { margin-top: 0.1rem; }
  .apercu dl { margin: 0; display: flex; flex-wrap: wrap; gap: 0.4rem 1.75rem; }
  .apercu dl > div { display: grid; gap: 0.05rem; }
  .apercu dt { font-size: 0.8rem; font-weight: 600; }
  .apercu dd { margin: 0; color: var(--encre); font-weight: 600; font-variant-numeric: tabular-nums; }
  .apercu .f-bornes { font-weight: 400; }

  /* ---- Page Sauvegarde : exporter, importer, bon à savoir. */
  .sauvegarde-cartes { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); }
  .sauvegarde-carte { display: flex; flex-direction: column; gap: 1.15rem; padding: 1.35rem 1.4rem 1.4rem; }
  .sauvegarde-tete { display: flex; align-items: flex-start; gap: 0.95rem; }
  .sauvegarde-tete > div { min-width: 0; }
  .sauvegarde-tete h2 { font-size: 1.1rem; font-weight: 650; }
  .sauvegarde-tete p { margin-top: 0.3rem; max-width: 62ch; color: var(--encre-douce); }
  .sauvegarde-icone { display: grid; place-items: center; flex: none; width: 2.6rem; height: 2.6rem; border-radius: 0.75rem; background: var(--accent-doux); color: var(--accent-texte); }
  .sauvegarde-icone.discrete { background: var(--bleu-doux); color: var(--bleu-texte); }
  .sauvegarde-contenu { padding: 0.8rem 1rem; border: 1px solid var(--trait); border-radius: var(--rayon-petit); background: var(--surface-douce); }
  .sauvegarde-contenu-titre { margin-bottom: 0.4rem; color: var(--encre-pale); font-size: 0.8rem; font-weight: 600; }
  .sauvegarde-comptes { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.3rem 1.25rem; }
  .sauvegarde-comptes li { color: var(--encre-douce); white-space: nowrap; }
  .sauvegarde-comptes strong { color: var(--encre); font-weight: 650; font-variant-numeric: tabular-nums; }
  .sauvegarde-actions { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; }
  /* Le sélecteur de fichier : le champ natif reste là pour le clavier, son libellé fait le bouton. */
  .champ-fichier { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; opacity: 0; overflow: hidden; clip-path: inset(50%); }
  .zone-import { flex: 1 1 auto; display: flex; flex-direction: column; align-items: stretch; }
  label.choix-fichier {
    flex: 1 1 auto; min-height: 5.5rem;
    display: flex; align-items: center; gap: 0.9rem; padding: 1rem 1.1rem;
    border: 1.5px dashed var(--trait-fort); border-radius: var(--rayon); background: var(--surface-douce);
    font-size: 1rem; font-weight: 400; cursor: pointer; transition: background-color 120ms, border-color 120ms;
  }
  label.choix-fichier:hover, .zone-import.survolee label.choix-fichier { border-color: var(--accent); background: var(--accent-doux); }
  .champ-fichier:focus-visible + .choix-fichier { outline: 3px solid var(--accent); outline-offset: 2px; }
  .choix-fichier-icone { display: grid; place-items: center; flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--surface); border: 1px solid var(--trait); color: var(--accent-texte); }
  .choix-fichier-texte { display: grid; gap: 0.1rem; min-width: 0; }
  .choix-fichier-action { color: var(--accent-texte); font-weight: 650; }
  .sauvegarde-format { color: var(--encre-douce); font-size: 0.875rem; }
  #import-message { display: flex; align-items: flex-start; gap: 0.5rem; margin: 0; padding: 0.65rem 0.85rem; border-radius: var(--rayon-petit); background: var(--accent-doux); color: var(--accent-texte); font-weight: 600; }
  #import-message .icone { margin-top: 0.05rem; }
  #import-message.erreur { background: var(--rouge-doux); color: var(--rouge-texte); }
  .sauvegarde-info { padding: 1.15rem 1.4rem; }
  .sauvegarde-points { margin: 0.45rem 0 0; padding-left: 1.1rem; display: grid; gap: 0.35rem; color: var(--encre-douce); }
  /* ==== fin T36 ==== */

  /* ---- Annonce passagère après un enregistrement */
  .annonce {
    position: fixed; left: 50%; bottom: 1.5rem; z-index: 20; transform: translateX(-50%);
    padding: 0.65rem 1.1rem; border-radius: 999px;
    background: var(--encre); color: var(--fond); font-weight: 600; box-shadow: var(--ombre-haute);
  }

  /* ---- Écran étroit : navigation en ruban sous la barre, une colonne */
  @media (max-width: 900px) {
    .app { display: block; height: auto; }
    .barre { position: sticky; top: 0; flex-wrap: wrap; gap: 0.35rem 1rem; padding-block: 0.6rem; }
    .marque-sous-titre { display: none; }
    .marque-logo { width: 1.75rem; height: 1.75rem; }
    .saison { margin-left: 0; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .indicateur { padding-inline: 0.75rem; }
    .indicateur:first-child { padding-left: 0; }
    .indicateur-valeur { flex-wrap: wrap; row-gap: 0; }
    .indicateur-bornes { white-space: normal; }
    .navigation { position: sticky; top: var(--hauteur-barre-mesuree, 6.5rem); z-index: 4; display: flex; gap: 0.25rem; overflow-x: auto; padding: 0.5rem; border-right: 0; border-bottom: 1px solid var(--trait); }
    .navigation ul { display: flex; gap: 0.25rem; }
    .navigation-groupe { display: none; }
    .navigation a { white-space: nowrap; }
    .contenu { overflow: visible; }
    .tiroir-corps { grid-template-columns: minmax(0, 1fr); }
  }
</style>

<script src="exemple.js"></script>
<script src="ui-commun.js"></script>
<script src="ui-navigation.js"></script>
<script src="ui-saisie.js"></script>
<script src="ui-tableau.js"></script>
<script src="ui-sauvegarde.js"></script>
<script src="ui-ventes.js"></script>
<script src="ui-poules.js"></script>
<script src="ui-synthese.js"></script>
<script src="ui-calendrier.js"></script>
<script>
(function () {
  "use strict";

  const T = UiCommun.T;
  let ferme = Store.ouvrir(window.localStorage);
  const fermeOuverte = () => ferme;
  const navigation = UiNavigation.creer();
  const saisie = UiSaisie.creer({ ferme: fermeOuverte, rafraichir });
  const ventes = UiVentes.creer({ ferme: fermeOuverte, saisie });
  const poules = UiPoules.creer({ saisie });
  const sauvegarde = UiSauvegarde.creer({
    ferme: fermeOuverte,
    apresImport: () => {
      saisie.quitterToutes();
      rafraichir();
    },
  });

  function donneesActives() {
    const donnees = {};
    for (const objet of Store.OBJETS) donnees[objet] = ferme.lister(objet);
    return donnees;
  }

  // EX-36 : tant qu'aucune plantation n'existe, la synthèse guide la première saisie, étape par étape.
  function afficherAccueil(donnees) {
    const fermeVide = Store.OBJETS.every((objet) => donnees[objet].length === 0);
    document.getElementById("accueil").hidden = donnees.plantations.length > 0;
    const faites = { espaces: donnees.espaces.length > 0, cultures: donnees.varietes.length > 0, plantations: donnees.plantations.length > 0 };
    document.querySelectorAll("#accueil [data-etape]").forEach((etape) => {
      etape.dataset.fait = String(faites[etape.dataset.etape]);
    });
    // EX-10 : l'exemple est proposé tant que la ferme est vide, effaçable tant qu'il en reste quelque chose.
    document.getElementById("proposition-exemple").hidden = !fermeVide;
    document.getElementById("bandeau-exemple").hidden = !Exemple.estAffichee(ferme);
  }

  // Tout l'affichage se recalcule depuis les données enregistrées (EX-05).
  function rafraichir() {
    const donnees = donneesActives();
    saisie.afficher(donnees);
    ventes.afficher(donnees);
    poules.afficher(donnees);
    sauvegarde.afficher(donnees);
    const tableau = Calc.tableau(donnees);
    UiTableau.afficher(tableau);
    UiSynthese.afficher(tableau, donnees);
    UiCalendrier.afficher(donnees);
    afficherAccueil(donnees);
    document.getElementById("pastille-sauvegarde").hidden = document.getElementById("rappel-export").hidden;
  }

  // ---- Démarrage

  document.title = T.titre;
  UiCommun.traduire(document);
  // Au téléphone, la navigation se colle sous la barre du haut, dont la hauteur suit son contenu.
  const barre = document.querySelector(".barre");
  new ResizeObserver(() => document.documentElement.style.setProperty("--hauteur-barre-mesuree", `${barre.offsetHeight}px`)).observe(barre);
  UiCommun.brancherOnglets(document.querySelector("#carte-projection .onglets"));
  saisie.brancher(document);
  sauvegarde.brancher();
  navigation.brancher();

  // « Ajouter … » : mène à la page de l'objet et ouvre son tiroir (EX-31).
  document.addEventListener("click", (evenement) => {
    const bouton = evenement.target.closest("[data-ouvrir]");
    if (!bouton) return;
    navigation.aller(UiNavigation.PAGE_DE[bouton.dataset.ouvrir]);
    saisie.ouvrir(bouton.dataset.ouvrir);
  });

  document.getElementById("proposition-texte").textContent = UiCommun.remplir(T.exemple.proposition, { plantations: Exemple.NOMBRE_DE_PLANTATIONS });
  document.getElementById("charger-exemple").addEventListener("click", () => {
    Exemple.charger(ferme, new Date().getFullYear());
    rafraichir();
  });
  document.getElementById("effacer-exemple").addEventListener("click", () => {
    Exemple.effacer(ferme);
    saisie.quitterToutes();
    rafraichir();
  });

  // EX-05 : une modification faite dans un autre onglet recalcule aussi cette page. Relire la ferme
  // évite en plus qu'une saisie ici n'écrase ce qui a été enregistré là-bas.
  window.addEventListener("storage", (evenement) => {
    if (evenement.key !== null && evenement.key !== Store.CLE) return;
    ferme = Store.ouvrir(window.localStorage);
    rafraichir();
  });
